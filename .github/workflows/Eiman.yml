name: User3 Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build
      run: docker build -t myapp .

    - name: Login
      run: echo "${{ secrets.USER3_PASSWORD }}" | docker login -u "${{ secrets.USER3_USERNAME }}" --password-stdin

    - name: Tag
      run: docker tag myapp ${{ secrets.USER3_USERNAME }}/myapp:latest

    - name: Push
      run: docker push ${{ secrets.USER3_USERNAME }}/myapp:latest
